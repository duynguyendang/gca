steps:
  # Build and push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/gca-be', '-f', 'Dockerfile', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/gca-be']

  # Write env vars file (YAML avoids gcloud dict comma issue)
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cat > /workspace/env.yaml <<EOF
        LOW_MEM: 'true'
        MEB_INDEX: 'brute'
        LLM_MODEL: 'googleai/gemini-3.1-flash-lite'
        LLM_PROVIDER: 'googleai'
        EMBEDDING_MODEL: 'googleai/gemini-embedding-001'
        CORS_ALLOW_ORIGINS: 'https://gca-hackathon.web.app,https://gca-hackathon.firebaseapp.com'
        CORS_REFLECT_ANY: 'true'
        EOF

  # Deploy to Cloud Run with secret from Secret Manager
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'gca-be'
      - '--image'
      - 'gcr.io/$PROJECT_ID/gca-be'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--memory'
      - '2Gi'
      - '--min-instances'
      - '1'
      - '--port'
      - '8080'
      - '--set-secrets'
      - 'LLM_API_KEY=GEMINI_KEY:latest'
      - '--env-vars-file'
      - '/workspace/env.yaml'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/gca-be'

options:
  logging: CLOUD_LOGGING_ONLY