run:
  timeout: 5m
  skip-dirs:
    - build
    - node_modules
    - vendor

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosimple
    - gofmt
    - goimports
    - misspell
    - whitespace
    - unused
  disable:
    - gocyclo
    - funlen

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - unused
        - errcheck
